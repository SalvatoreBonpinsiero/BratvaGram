name: Build BratvaGram APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=6144
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost"

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 'Nekogram/Nekogram'
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android SDK Environment
        run: |
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Apply BratvaGram Patch
        run: |
          python3 - << 'EOF'
          import os
          import re

          for root, _, files in os.walk("TMessagesProj/src/main/res"):
              for file in files:
                  if file == "strings.xml":
                      p = os.path.join(root, file)
                      try:
                          with open(p, "r", encoding="utf-8", errors="ignore") as f:
                              c = f.read()
                          c = re.sub(r'<string name="AppName">.*?</string>', '<string name="AppName">BratvaGram</string>', c)
                          c = re.sub(r'<string name="AppNameBeta">.*?</string>', '<string name="AppNameBeta">BratvaGram Beta</string>', c)
                          c = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">BratvaGram</string>', c)
                          with open(p, "w", encoding="utf-8") as f:
                              f.write(c)
                      except Exception:
                          pass

          for root, _, files in os.walk("TMessagesProj/src/main/java"):
              for file in files:
                  if file.endswith((".java", ".kt")):
                      p = os.path.join(root, file)
                      try:
                          with open(p, "r", encoding="utf-8", errors="ignore") as f:
                              code = f.read()
                          
                          changed = False
                          if "useByeDpi" in code:
                              code = re.sub(r'useByeDpi\s*=\s*false', 'useByeDpi = true', code)
                              changed = True
                          if "bypassDpi" in code:
                              code = re.sub(r'bypassDpi\s*=\s*false', 'bypassDpi = true', code)
                              changed = True
                          if "enableLocalProxy" in code:
                              code = re.sub(r'enableLocalProxy\s*=\s*false', 'enableLocalProxy = true', code)
                              changed = True
                          if "DEFAULT_BYEDPI_ARGS" in code:
                              code = re.sub(r'DEFAULT_BYEDPI_ARGS\s*=\s*".*?"', 'DEFAULT_BYEDPI_ARGS = "--split 2 --disoob 1 --auto=torst"', code)
                              changed = True
                          if "defaultByedpiArgs" in code:
                              code = re.sub(r'defaultByedpiArgs\s*=\s*".*?"', 'defaultByedpiArgs = "--split 2 --disoob 1 --auto=torst"', code)
                              changed = True

                          if changed:
                              with open(p, "w", encoding="utf-8") as f:
                                  f.write(code)
                      except Exception:
                          pass
          EOF

      - name: Configure Build Memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m" > ~/.gradle/gradle.properties
          echo "org.gradle.workers.max=2" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=false" >> ~/.gradle/gradle.properties
          echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
          chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleAfatDebug --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BratvaGram-Bypass-APK
          path: TMessagesProj/build/outputs/apk/**/*.apk

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TMessagesProj/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
