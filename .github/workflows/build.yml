name: Build BratvaGram PC Bundle

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-bundle:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download WinDivert Driver
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip" -OutFile "windivert.zip"
          Expand-Archive -Path "windivert.zip" -DestinationPath "windivert_extracted"
          Copy-Item "windivert_extracted\WinDivert-2.2.2-A\x64\WinDivert.dll" -Destination "."
          Copy-Item "windivert_extracted\WinDivert-2.2.2-A\x64\WinDivert64.sys" -Destination "."

      - name: Download Official Telegram Desktop Portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bundle_dist\Telegram"
          Invoke-WebRequest -Uri "https://telegram.org/dl/desktop/win64_portable" -OutFile "tportable.zip"
          Expand-Archive -Path "tportable.zip" -DestinationPath "temp_tg"
          
          if (Test-Path "temp_tg\Telegram\Telegram.exe") {
            Copy-Item -Path "temp_tg\Telegram\*" -Destination "bundle_dist\Telegram" -Recurse
          } else {
            Copy-Item -Path "temp_tg\*" -Destination "bundle_dist\Telegram" -Recurse
          }

      - name: Build BratvaGram.exe Launcher
        run: |
          pyinstaller --noconfirm --onefile --console --name "BratvaGram" `
            --add-binary "WinDivert.dll;." `
            --add-binary "WinDivert64.sys;." `
            --uac-admin `
            launcher.py
          copy dist\BratvaGram.exe bundle_dist\

      - name: Compress Full Portable Package
        shell: pwsh
        run: |
          Compress-Archive -Path "bundle_dist\*" -DestinationPath "BratvaGram_PC_Portable.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BratvaGram-PC-Portable
          path: BratvaGram_PC_Portable.zip

      - name: Release Portable Bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BratvaGram_PC_Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
