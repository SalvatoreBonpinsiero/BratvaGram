name: Build BratvaDPI Windows Service

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download WinDivert Binaries
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip" -OutFile "windivert.zip"
          Expand-Archive -Path "windivert.zip" -DestinationPath "windivert_extracted"
          Copy-Item "windivert_extracted\WinDivert-2.2.2-A\x64\WinDivert.dll" -Destination "."
          Copy-Item "windivert_extracted\WinDivert-2.2.2-A\x64\WinDivert64.sys" -Destination "."

      - name: Build Service Executable
        run: |
          pyinstaller --noconfirm --onefile --console --name "BratvaService" `
            --add-binary "WinDivert.dll;." `
            --add-binary "WinDivert64.sys;." `
            --uac-admin `
            service.py

      - name: Prepare Release Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bundle"
          Copy-Item "dist\BratvaService.exe" -Destination "bundle\"
          Copy-Item "WinDivert.dll" -Destination "bundle\"
          Copy-Item "WinDivert64.sys" -Destination "bundle\"
          Copy-Item "service_install.bat" -Destination "bundle\"
          Copy-Item "service_remove.bat" -Destination "bundle\"
          Compress-Archive -Path "bundle\*" -DestinationPath "BratvaDPI_Service_x64.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BratvaDPI-Windows-Service
          path: BratvaDPI_Service_x64.zip

      - name: Release Executable
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BratvaDPI_Service_x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
