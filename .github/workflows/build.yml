name: Build BratvaGram APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" /usr/local/lib/android

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y zipalign curl
          curl -fsSL "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" -o apktool
          curl -fsSL "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -o apktool.jar
          chmod +x apktool
          sudo mv apktool apktool.jar /usr/local/bin/
          curl -fsSL "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" -o uber-apk-signer.jar

      - name: Download Base APK
        run: |
          curl -fL -A "Mozilla/5.0" "https://github.com/Nekogram/Nekogram/releases/download/v12.9.2/Nekogram-12.9.2-6991-arm64-v8a.apk" -o base.apk

      - name: Decompile APK
        run: |
          export _JAVA_OPTIONS="-Xmx6144M"
          apktool d -f base.apk -o decompiled_apk

      - name: Apply BratvaGram Patch
        run: |
          python3 - << 'EOF'
          import os
          import re

          def sub_str(m):
              pre, val, post = m.group(1), m.group(2), m.group(3)
              val = val.replace("Nekogram Beta", "BratvaGram Beta")
              val = val.replace("Nekogram", "BratvaGram")
              val = val.replace("Neko Settings", "Bratva Settings")
              val = val.replace("Настройки Neko", "Настройки Bratva")
              val = val.replace("Neko", "Bratva")
              return f"{pre}{val}{post}"

          for root, _, files in os.walk("decompiled_apk/res"):
              for file in files:
                  if file == "strings.xml":
                      p = os.path.join(root, file)
                      try:
                          with open(p, "r", encoding="utf-8", errors="ignore") as f:
                              c = f.read()
                          c = re.sub(r'(<string\s+name="[^"]+"[^>]*>)(.*?)(</string>)', sub_str, c, flags=re.DOTALL)
                          with open(p, "w", encoding="utf-8") as f:
                              f.write(c)
                      except Exception:
                          pass

          for root, _, files in os.walk("decompiled_apk"):
              for file in files:
                  if file.endswith(".smali"):
                      p = os.path.join(root, file)
                      try:
                          with open(p, "r", encoding="utf-8", errors="ignore") as f:
                              code = f.read()

                          changed = False
                          if "useByeDpi" in code:
                              code = re.sub(r'const/4\s+v(\d+),\s*0x0\s+sput-boolean\s+v\1,\s*L[^;]+;->useByeDpi:Z', r'const/4 v\1, 0x1\n    sput-boolean v\1, Ltw/nekomimi/nekogram/NekoConfig;->useByeDpi:Z', code)
                              changed = True

                          if "byedpiArgs" in code or "DEFAULT_BYEDPI_ARGS" in code or "defaultByedpiArgs" in code:
                              code = re.sub(r'const-string\s+v(\d+),\s*""', r'const-string v\1, "--split 2 --disoob 1 --auto=torst"', code)
                              changed = True

                          if changed:
                              with open(p, "w", encoding="utf-8") as f:
                                  f.write(code)
                      except Exception:
                          pass
          EOF

      - name: Rebuild APK
        run: |
          export _JAVA_OPTIONS="-Xmx6144M"
          apktool b decompiled_apk -o unsigned_bratvagram.apk

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar -a unsigned_bratvagram.apk --allowResign -o dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BratvaGram-Release-APK
          path: dist/*.apk

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
