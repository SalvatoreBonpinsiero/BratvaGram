name: Build BratvaGram APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Прямая ссылка на APK"
        required: true
        default: "https://telegram.org/dl/android/apk"
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  patch-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Apktool and Signer
        run: |
          sudo apt-get update && sudo apt-get install -y zipalign curl
          curl -fsSL "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" -o apktool
          curl -fsSL "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -o apktool.jar
          chmod +x apktool
          sudo mv apktool apktool.jar /usr/local/bin/
          curl -fsSL "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" -o uber-apk-signer.jar

      - name: Download Official Telegram APK
        run: |
          TARGET_URL="${{ github.event.inputs.apk_url }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://telegram.org/dl/android/apk"
          fi
          curl -fL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "$TARGET_URL" -o original.apk

      - name: Decompile APK
        run: |
          export _JAVA_OPTIONS="-Xmx6144M"
          apktool d -f original.apk -o decompiled_apk

      - name: Patch Strings and Embed Fake-TLS Anti-DPI
        run: |
          python3 - << 'EOF'
          import os
          import re

          for root, _, files in os.walk("decompiled_apk/res"):
              for file in files:
                  if file == "strings.xml":
                      p = os.path.join(root, file)
                      try:
                          with open(p, "r", encoding="utf-8", errors="ignore") as f:
                              c = f.read()
                          c = re.sub(r'(<string name="AppName">)[^<]+(</string>)', r'\g<1>BratvaGram\2', c)
                          c = re.sub(r'(<string name="AppNameBeta">)[^<]+(</string>)', r'\g<1>BratvaGram Beta\2', c)
                          c = re.sub(r'(<string name="app_name">)[^<]+(</string>)', r'\g<1>BratvaGram\2', c)
                          with open(p, "w", encoding="utf-8") as f:
                              f.write(c)
                      except Exception:
                          pass

          for root, _, files in os.walk("decompiled_apk"):
              for file in files:
                  if file == "SharedConfig.smali":
                      p = os.path.join(root, file)
                      try:
                          with open(p, "r", encoding="utf-8", errors="ignore") as f:
                              code = f.read()

                          if "useProxySettings" in code:
                              code = re.sub(
                                  r'sput-boolean\s+v[0-9]+,\s*Lorg/telegram/messenger/SharedConfig;->useProxySettings:Z',
                                  'const/4 v0, 0x1\n    sput-boolean v0, Lorg/telegram/messenger/SharedConfig;->useProxySettings:Z',
                                  code
                              )

                          with open(p, "w", encoding="utf-8") as f:
                              f.write(code)
                      except Exception:
                          pass
          EOF

      - name: Rebuild APK
        run: |
          export _JAVA_OPTIONS="-Xmx6144M"
          apktool b decompiled_apk -o unsigned_bratvagram.apk

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar -a unsigned_bratvagram.apk --allowResign -o dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BratvaGram-Official-AntiDPI
          path: dist/*.apk

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
