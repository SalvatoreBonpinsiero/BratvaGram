name: Build BratvaGram APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y zipalign curl zip unzip
          curl -fsSL "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" -o uber-apk-signer.jar

      - name: Download Stable Base APK
        run: |
          curl -fL -A "Mozilla/5.0" "https://github.com/Nekogram/Nekogram/releases/download/v12.9.2/Nekogram-12.9.2-6991-arm64-v8a.apk" -o base.apk

      - name: Direct Package Assembly
        run: |
          python3 - << 'EOF'
          import zipfile
          import os

          with zipfile.ZipFile("base.apk", "r") as zin:
              with zipfile.ZipFile("temp_mod.apk", "w", compression=zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      buffer = zin.read(item.filename)
                      if item.filename.startswith("META-INF/"):
                          continue
                      if item.filename == "resources.arsc":
                          zout.writestr(item, buffer, compress_type=zipfile.ZIP_STORED)
                      elif item.filename.endswith(".so"):
                          zout.writestr(item, buffer, compress_type=zipfile.ZIP_STORED)
                      else:
                          zout.writestr(item, buffer)
          EOF

      - name: Align and Sign APK
        run: |
          zipalign -p -f 4 temp_mod.apk aligned.apk
          java -jar uber-apk-signer.jar -a aligned.apk --allowResign -o dist/
          mv dist/*-aligned-signed.apk dist/BratvaGram.apk || mv dist/*.apk dist/BratvaGram.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BratvaGram-Stable-APK
          path: dist/BratvaGram.apk

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BratvaGram.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
