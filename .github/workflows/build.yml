name: Build BratvaGram APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" /usr/local/lib/android

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y zipalign curl
          curl -fsSL "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" -o apktool
          curl -fsSL "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -o apktool.jar
          chmod +x apktool
          sudo mv apktool apktool.jar /usr/local/bin/
          curl -fsSL "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" -o uber-apk-signer.jar

      - name: Download Target APK
        run: |
          curl -fL -A "Mozilla/5.0" "https://github.com/Nekogram/Nekogram/releases/download/v12.9.2/Nekogram-12.9.2-6991-arm64-v8a.apk" -o base.apk

      - name: Decompile Resources Only
        run: |
          export _JAVA_OPTIONS="-Xmx6144M"
          apktool d -s -f base.apk -o decompiled_apk

      - name: Apply Safe Branding Patch
        run: |
          python3 - << 'EOF'
          import os
          import re

          def sanitize_val(m):
              head = m.group(1)
              val = m.group(2)
              tail = m.group(3)
              if val.strip().startswith("@"):
                  return m.group(0)
              val = val.replace("Nekogram Beta", "BratvaGram Beta")
              val = val.replace("Nekogram", "BratvaGram")
              val = val.replace("Neko Settings", "Bratva Settings")
              val = val.replace("Настройки Neko", "Настройки Bratva")
              val = val.replace("Neko", "Bratva")
              return f"{head}{val}{tail}"

          for root, _, files in os.walk("decompiled_apk/res"):
              for file in files:
                  if file == "strings.xml":
                      p = os.path.join(root, file)
                      try:
                          with open(p, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()
                          content = re.sub(r'(<string\s+name="[^"]+"[^>]*>)(.*?)(</string>)', sanitize_val, content, flags=re.DOTALL)
                          with open(p, "w", encoding="utf-8") as f:
                              f.write(content)
                      except Exception:
                          pass
          EOF

      - name: Rebuild APK
        run: |
          export _JAVA_OPTIONS="-Xmx6144M"
          apktool b decompiled_apk -o unsigned_bratvagram.apk

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar -a unsigned_bratvagram.apk --allowResign -o dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BratvaGram-Stable-APK
          path: dist/*.apk

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
