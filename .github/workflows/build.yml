name: Build BratvaGram APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y zipalign curl jq
          curl -fsSL "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" -o apktool
          curl -fsSL "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -o apktool.jar
          chmod +x apktool
          sudo mv apktool apktool.jar /usr/local/bin/
          curl -fsSL "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" -o uber-apk-signer.jar

      - name: Fetch Latest Base APK with Native Anti-DPI
        run: |
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/Nekogram/Nekogram/releases/latest | jq -r '.assets[] | select(.name | contains("arm64-v8a.apk")) | .browser_download_url' | head -n 1)
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            DOWNLOAD_URL="https://github.com/Nekogram/Nekogram/releases/download/v10.9.1/Nekogram-v10.9.1-arm64-v8a.apk"
          fi
          curl -fL -A "Mozilla/5.0" "$DOWNLOAD_URL" -o base.apk

      - name: Decompile Resources Only
        run: |
          apktool d -s base.apk -o decompiled_apk

      - name: Rebrand to BratvaGram
        run: |
          python3 - << 'EOF'
          import os
          import re

          for root, _, files in os.walk("decompiled_apk/res"):
              for file in files:
                  if file == "strings.xml":
                      p = os.path.join(root, file)
                      try:
                          with open(p, "r", encoding="utf-8", errors="ignore") as f:
                              c = f.read()
                          
                          c = re.sub(r'<string name="AppName">.*?</string>', '<string name="AppName">BratvaGram</string>', c)
                          c = re.sub(r'<string name="AppNameBeta">.*?</string>', '<string name="AppNameBeta">BratvaGram Beta</string>', c)
                          c = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">BratvaGram</string>', c)
                          
                          c = c.replace("Nekogram", "BratvaGram")
                          c = c.replace("Neko Settings", "Bratva Settings")
                          c = c.replace("Настройки Neko", "Настройки Bratva")

                          with open(p, "w", encoding="utf-8") as f:
                              f.write(c)
                      except Exception:
                          pass
          EOF

      - name: Rebuild BratvaGram APK
        run: |
          apktool b decompiled_apk -o unsigned_bratvagram.apk

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar -a unsigned_bratvagram.apk --allowResign -o dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BratvaGram-Bypass-APK
          path: dist/*.apk

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
